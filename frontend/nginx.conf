server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-роутинг: React Router (когда появится) сам решает, что показать
    # по пути /tasks/123 — Nginx должен отдавать index.html на любой путь,
    # которому не соответствует реальный файл, а не 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
