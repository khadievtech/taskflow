services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow} -d ${POSTGRES_DB:-taskflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taskflow-net
    # unless-stopped — контейнер сам поднимется после перезагрузки домашнего
    # ноутбука, но не будет пытаться бесконечно рестартовать, если вы
    # осознанно остановили его сами (docker compose stop).
    restart: unless-stopped

  backend:
    image: ghcr.io/${GHCR_OWNER}/taskflow-backend:latest
    environment:
      APP_NAME: TaskFlow API
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@db:5432/${POSTGRES_DB:-taskflow}
      CORS_ORIGINS: ${CORS_ORIGINS}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
    ports:
      # Привязка к 127.0.0.1 вместо 0.0.0.0: порт доступен для отладки с самой
      # машины (curl, psql), но не виден другим устройствам в локальной сети.
      # Внешний трафик идёт только через reverse-proxy.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taskflow-net
    restart: unless-stopped
    # Этот label читает Watchtower ниже — обновляет только помеченные
    # контейнеры. db осознанно НЕ помечена: обновления мажорной версии
    # Postgres без вашего контроля — плохая идея, БД обновляем руками.
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  frontend:
    image: ghcr.io/${GHCR_OWNER}/taskflow-frontend:latest
    # Порт наружу не публикуется: nginx фронтенда доступен только внутри
    # docker-сети, а внешние запросы приходят через reverse-proxy.
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - taskflow-net
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Обратный прокси — единственная точка входа снаружи. Конфиг лежит файлом
  # на диске (proxy/nginx.conf), а не в собственном образе: правка маршрута
  # не требует полного цикла CI/CD, достаточно nginx -s reload.
  reverse-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - taskflow-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/api/v1/health/live"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Watchtower следит за тегами образов в GHCR и сам делает pull + пересоздаёт
  # контейнер, когда появляется новый — это и есть механизм "pull", который
  # мы выбрали вместо push по SSH из GitHub Actions.
  #
  # ВАЖНО про выбор образа: оригинальный containrrr/watchtower архивирован
  # 17.12.2025 (авторы потеряли интерес к проекту) и несовместим с Docker 29+
  # — его встроенный клиент говорит по API 1.25, который демон уже не принимает.
  # nickfedor/watchtower — наиболее активно поддерживаемый форк, drop-in замена
  # (те же лейблы, флаги и переменные), автонегоциирует версию API.
  #
  # Осознанное временное решение: авторы самого форка не рекомендуют Watchtower
  # для production и советуют Kubernetes + CI/CD. Это наш Phase 7 — тогда
  # Watchtower уйдёт, а его роль возьмут на себя Deployment'ы и rolling update.
  watchtower:
    image: nickfedor/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60 --label-enable --cleanup
    # --interval 60      — проверять раз в минуту (для pet-проекта достаточно)
    # --label-enable     — трогать только контейнеры с label выше (не db)
    # --cleanup          — удалять старые образы после обновления, чтобы не
    #                      забить диск на домашнем ноутбуке со временем
    networks:
      - taskflow-net
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  # Сеть создаётся вне compose-файлов (docker network create taskflow-shared)
  # и переиспользуется стеком мониторинга — см. docker-compose.observability.yml.
  # Так Prometheus видит backend по DNS-имени сервиса, оставаясь при этом
  # в отдельном compose-проекте с независимым жизненным циклом.
  taskflow-net:
    external: true
    name: taskflow-shared
