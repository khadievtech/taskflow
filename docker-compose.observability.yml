services:
  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      # Монтируется весь каталог, включая подкаталог rules/ — на него
      # ссылается rule_files в prometheus.yml.
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Ограничение хранения обязательно: без него база метрик растёт
      # бесконечно и со временем заполнит диск домашней машины.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.path=/prometheus
      # Позволяет перечитать конфиг без перезапуска контейнера:
      # curl -X POST http://localhost:9090/-/reload
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - alertmanager
    networks:
      - taskflow-net
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      # Монтируем каталог целиком: внутри и конфиг, и файл с токеном бота,
      # на который ссылается bot_token_file.
      - ./observability/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # Нужен для корректных ссылок в уведомлениях и для работы кнопки
      # Silence в интерфейсе.
      - --web.external-url=http://localhost:9093
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - taskflow-net
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.1
    volumes:
      - ./observability/loki:/etc/loki:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - taskflow-net
    restart: unless-stopped

  # Alloy — сборщик логов, заменивший Promtail (EOL 2 марта 2026).
  alloy:
    image: grafana/alloy:v1.17.0
    volumes:
      - ./observability/alloy:/etc/alloy:ro
      # Сокет Docker нужен, чтобы обнаруживать контейнеры и читать их логи.
      # ro ограничивает запись, но даже чтение сокета — существенная привилегия:
      # через него виден весь список контейнеров и их вывод. На реальном
      # production-хосте между агентом и сокетом ставят docker-socket-proxy,
      # разрешающий только нужные API-эндпоинты.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    # root нужен для чтения сокета: образ Alloy по умолчанию работает от
    # непривилегированного пользователя (UID 473), которому сокет недоступен.
    user: root
    command:
      - run
      # Без listen-addr 0.0.0.0 отладочный интерфейс Alloy не виден с хоста.
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      # Отладочный UI: показывает граф компонентов и что реально течёт по
      # конвейеру. Первое место, куда смотреть, если логи не доходят до Loki.
      - "127.0.0.1:12345:12345"
    depends_on:
      - loki
    networks:
      - taskflow-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Отключаем отправку анонимной статистики и проверку обновлений —
      # лишние исходящие запросы от инфраструктурного сервиса не нужны.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - taskflow-net
    restart: unless-stopped

  # Экспортёр: Postgres не умеет отдавать метрики в формате Prometheus, поэтому
  # отдельный процесс подключается к БД обычным SQL, читает системные вьюхи
  # (pg_stat_database и прочие) и публикует их как метрики. Тот же паттерн
  # используется для Redis, Kafka, Nginx, RabbitMQ.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@db:5432/${POSTGRES_DB:-taskflow}?sslmode=disable
    networks:
      - taskflow-net
    restart: unless-stopped

volumes:
  alertmanager-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:

networks:
  # external: true означает, что сеть создаётся вне этого compose-файла и
  # существует независимо от него. Так два разных compose-проекта (приложение
  # и мониторинг) оказываются в одной сети и видят друг друга по именам
  # сервисов — Prometheus может обратиться к backend:8000, хотя backend
  # описан в другом файле.
  taskflow-net:
    external: true
    name: taskflow-shared
