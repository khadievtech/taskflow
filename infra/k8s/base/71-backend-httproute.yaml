# Общий маршрут ко всем эндпоинтам backend, КРОМЕ входа/регистрации —
# для них отдельный, более узкий маршрут ниже (72), с ограничением частоты.
#
# Gateway API сортирует правила по специфичности совпадения пути
# независимо от того, в каком HTTPRoute они объявлены: более длинный
# префикс побеждает более короткий. Поэтому /api/v1/auth/ из 72-го файла
# сработает раньше, чем общий /api/ здесь, хотя это два разных объекта.

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
  namespace: taskflow
spec:
  parentRefs:
    - name: taskflow
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      backendRefs:
        - name: backend
          port: 8000
