# Frontend — тоже stateless: React-приложение отдаётся статикой через nginx,
# ничего не хранит, любую реплику можно убить и заменить любой другой.
# Отсюда Deployment, а не StatefulSet — та же логика, что и для backend.
#
# В отличие от backend, здесь нет ни ConfigMap, ни Secret: с Phase 5a
# фронтенд обращается к API относительными путями (/api/v1/...), адрес
# backend не запекается в бандл на этапе сборки, и переменных окружения
# на старте контейнеру не требуется вообще.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: taskflow
  labels:
    app.kubernetes.io/name: frontend
spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: frontend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/khadievtech/taskflow-frontend:latest

          ports:
            - name: http
              containerPort: 80

          # nginx отдаёт статику — тривиальный процесс, готовность и
          # жизнеспособность здесь неотличимы друг от друга (в отличие от
          # backend, где readiness трогает БД, а liveness нет). Один и тот
          # же путь для обеих проб оправдан: если nginx отвечает на "/",
          # значит он и жив, и готов одновременно.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          # Заметно скромнее backend: nginx, раздающий статические файлы,
          # не выполняет вычислений — только чтение файлов и передача байтов.
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 128Mi
              cpu: 200m
