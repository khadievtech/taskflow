# Namespace — логическая изоляция группы объектов внутри одного кластера.
#
# Зачем: без него всё попадёт в namespace default вперемешку с чем угодно.
# С ним объекты приложения отделены от системных (kube-system), можно одной
# командой удалить всё разом, а позже назначить квоты ресурсов и права доступа
# именно на это пространство.
#
# Ближайший аналог из вашего опыта — флаг -p taskflow-prod у docker compose.
#
# Числовой префикс в имени файла — соглашение, а не требование Kubernetes.
# kubectl apply -f каталог/ применяет файлы по алфавиту, а namespace должен
# существовать раньше объектов, которые в нём создаются.

apiVersion: v1
kind: Namespace
metadata:
  name: taskflow
  labels:
    # Метки — произвольные пары ключ-значение. По ним ищут и группируют
    # объекты. Префикс app.kubernetes.io/ — рекомендованный набор
    # стандартных меток, его понимают инструменты вроде Helm и дашборды.
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/managed-by: kubectl
