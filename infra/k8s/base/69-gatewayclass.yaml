# GatewayClass — связующее звено между объектом Gateway и контроллером Kong.
#
# Аннотация konghq.com/gatewayclass-unmanaged: 'true' обязательна для нашего
# сценария. Без неё Gateway навсегда остаётся в статусе "Waiting for
# controller" — проверено на практике: контроллер запускает слежение за
# GatewayClass, сам класс становится Accepted=True, но конкретный объект
# Gateway не обрабатывается вообще, Last Transition Time остаётся
# 1970-01-01 (значение по умолчанию, событие ни разу не произошло).
#
# Причина: Kong поддерживает два режима работы с Gateway API.
#   - "managed"   — контроллер сам провижинит отдельный прокси-под на
#                   КАЖДЫЙ объект Gateway (аналог того, как ведёт себя
#                   NGINX Gateway Fabric 2.x). Требует отдельный ресурс
#                   GatewayConfiguration, который мы не создавали.
#   - "unmanaged" — контроллер просто настраивает УЖЕ существующий прокси
#                   (тот, что чарт kong/ingress поставил как kong-gateway)
#                   под правила из Gateway/HTTPRoute. Это наш случай: прокси
#                   уже установлен Helm-чартом, плодить второй незачем.
#
# controllerName жёстко зашит в код контроллера, не значение на выбор.

apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: kong
  annotations:
    konghq.com/gatewayclass-unmanaged: "true"
spec:
  controllerName: konghq.com/kic-gateway-controller
