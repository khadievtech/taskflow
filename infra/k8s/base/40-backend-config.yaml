# ConfigMap — несекретные настройки приложения.
#
# Отличие от Secret: значения видны в выводе kubectl по умолчанию, на них не
# настраивают отдельные права. Всё, что не является секретом, кладут сюда —
# так секреты не тонут в общем списке переменных, и права на них можно
# ограничить отдельно.
#
# Разделение проходит по простому признаку: попадание значения в чужие руки
# даёт доступ? Тогда Secret. Не даёт? Тогда ConfigMap.

apiVersion: v1
kind: ConfigMap
metadata:
  name: backend
  namespace: taskflow
data:
  APP_NAME: "TaskFlow API"
  ENVIRONMENT: "production"
  DEBUG: "false"

  # Строкой, а не булевым значением: все значения в ConfigMap — строки.
  # Приведёт к нужному типу pydantic-settings при чтении.
  #
  # false, потому что TLS ещё нет (Phase 5b). С флагом Secure браузер вообще
  # не отправлял бы cookie по HTTP, и вход не работал бы.
  COOKIE_SECURE: "false"

  # Регистрация закрыта — учётная запись уже создана.
  ALLOW_REGISTRATION: "false"

  # Пустой список: после появления Ingress фронтенд и API окажутся на одном
  # origin, и CORS не понадобится, как это уже произошло с обратным прокси.
  CORS_ORIGINS: "[]"

  # OpenTelemetry: куда слать трейсы и как называть сервис в Tempo.
  OTEL_SERVICE_NAME: "taskflow-backend"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo.monitoring.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_TRACES_EXPORTER: "otlp"
  # Метрики и логи уже есть через собственные пайплайны
  # (prometheus-fastapi-instrumentator, структурированный JSON в stdout).
  # Отключаем встроенные метрики/логи OTel явно, чтобы не завести вторую,
  # частично дублирующую систему инструментации.
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
  # 100% семплирование оправдано только на масштабе pet-проекта с низким
  # трафиком. На реальной нагрузке это первое, что стоит уменьшить --
  # например, OTEL_TRACES_SAMPLER=parentbased_traceidratio с
  # OTEL_TRACES_SAMPLER_ARG=0.1 (10% трейсов).
  OTEL_TRACES_SAMPLER: "always_on"
