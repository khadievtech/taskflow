# ConfigMap — несекретные настройки приложения.
#
# Отличие от Secret: значения видны в выводе kubectl по умолчанию, на них не
# настраивают отдельные права. Всё, что не является секретом, кладут сюда —
# так секреты не тонут в общем списке переменных, и права на них можно
# ограничить отдельно.
#
# Разделение проходит по простому признаку: попадание значения в чужие руки
# даёт доступ? Тогда Secret. Не даёт? Тогда ConfigMap.

apiVersion: v1
kind: ConfigMap
metadata:
  name: backend
  namespace: taskflow
data:
  APP_NAME: "TaskFlow API"
  ENVIRONMENT: "production"
  DEBUG: "false"

  # Строкой, а не булевым значением: все значения в ConfigMap — строки.
  # Приведёт к нужному типу pydantic-settings при чтении.
  #
  # false, потому что TLS ещё нет (Phase 5b). С флагом Secure браузер вообще
  # не отправлял бы cookie по HTTP, и вход не работал бы.
  COOKIE_SECURE: "false"

  # Регистрация закрыта — учётная запись уже создана.
  ALLOW_REGISTRATION: "false"

  # Пустой список: после появления Ingress фронтенд и API окажутся на одном
  # origin, и CORS не понадобится, как это уже произошло с обратным прокси.
  CORS_ORIGINS: "[]"
