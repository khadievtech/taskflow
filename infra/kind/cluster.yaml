# Описание локального кластера для kind.
#
# Кластер создаётся файлом, а не набором флагов в командной строке — тот же
# принцип инфраструктуры как кода, что и везде в проекте.
#
# Создать:  kind create cluster --config infra/kind/cluster.yaml
# Удалить:  kind delete cluster --name taskflow

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: taskflow

nodes:
  - role: control-plane

    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"

    # containerPort — НЕ 80/443 напрямую, а конкретные NodePort'ы
    # (диапазон 30000-32767), которые зададим сервису Kong при установке
    # флагом --set proxy.type=NodePort. Порты на хосте (8080/8443) те же,
    # что и раньше — 80 занят обратным прокси из Docker Compose.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP

  - role: worker
  - role: worker
