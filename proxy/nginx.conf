# Обратный прокси — единая точка входа в приложение.
#
# Что даёт по сравнению с прямым доступом к портам сервисов:
# 1. Один вход вместо зоопарка портов (80, 8000, 3000, 9090, 9093...).
# 2. Единая точка для политик: блокировка путей, заголовки безопасности,
#    в будущем TLS и rate limiting. Раньше это пришлось бы настраивать
#    в каждом сервисе отдельно.
# 3. Запросы фронтенда и API идут с одного origin, поэтому CORS не нужен
#    вообще, а адрес backend не приходится запекать в JS-бандл.

upstream backend_upstream {
    server backend:8000;
    keepalive 16;
}

upstream frontend_upstream {
    server frontend:80;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    # Не раскрываем версию nginx в заголовках и страницах ошибок.
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Блокировка метрик снаружи. Знак = означает точное совпадение пути и
    # даёт наивысший приоритет — правило сработает раньше location /.
    #
    # Мониторинг при этом не ломается: Prometheus скрейпит backend:8000
    # напрямую по внутренней docker-сети, минуя прокси. То есть метрики
    # доступны системе наблюдения и недоступны из внешней сети.
    location = /metrics {
        access_log off;
        return 404;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # $request_id — встроенная переменная nginx, уникальная строка из 32
        # шестнадцатеричных символов на каждый запрос. Прокси присваивает
        # идентификатор на входе в систему, а RequestContextMiddleware в
        # приложении подхватывает его из заголовка вместо генерации своего.
        #
        # Это правильный порядок: идентификатор должен рождаться на самой
        # границе системы, тогда он покрывает весь путь запроса. Если бы его
        # создавало приложение, время, проведённое запросом в прокси,
        # осталось бы вне трассировки.
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}
