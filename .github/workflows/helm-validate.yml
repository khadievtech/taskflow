name: Helm chart

on:
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/helm-validate.yml"
  push:
    branches: [main]
    paths:
      - "charts/**"

jobs:
  # Уровень 1 -- lint и рендеринг, без кластера. Ловит именно тот класс
  # ошибок, что мы находили при разработке: {{ }} в комментариях,
  # несовпадение отступов в toYaml/nindent, отсутствующие обязательные
  # значения.
  lint-and-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Helm lint
        run: helm lint charts/taskflow

      - name: Helm template (dry values)
        # Тестовые значения секретов -- не реальные, чарт не устанавливается
        # в кластер на этом уровне, только проверяется корректность
        # генерируемого YAML.
        run: |
          helm template charts/taskflow \
            --set secrets.postgresPassword=ci-test-password \
            --set secrets.jwtSecretKey=ci-test-jwt-key \
            > /tmp/rendered.yaml

      - name: Validate rendered manifests against Kubernetes schema
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
          # -ignore-missing-schemas: Gateway API/Kong CRD (GatewayClass,
          # Gateway, HTTPRoute, KongPlugin) не имеют официальной схемы
          # Kubernetes -- та же оговорка, что и в k8s-validate.yml для
          # raw-манифестов.
          kubeconform -strict -summary \
            -kubernetes-version 1.32.0 \
            -ignore-missing-schemas \
            /tmp/rendered.yaml

  # Уровень 2 -- реальная установка в эфемерный kind-кластер. Именно на
  # этом уровне были пойманы обе реальные находки при разработке чарта:
  # Job-хук pre-install падал раньше создания зависимых ресурсов
  # (ConfigMap "not found", затем DNS-имя Postgres "not known") --
  # ни helm lint, ни рендеринг в YAML эту проблему не обнаруживают,
  # только применение к настоящему API-серверу.
  install-in-kind:
    runs-on: ubuntu-latest
    needs: lint-and-template
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci-taskflow-helm
          wait: 90s

      - name: Install Gateway API CRDs
        run: |
          kubectl apply --server-side -f \
            https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/standard-install.yaml

      - name: Install Kong (Gateway API controller, DB-less)
        run: |
          helm repo add kong https://charts.konghq.com
          helm repo update
          helm install kong kong/ingress \
            --namespace kong --create-namespace \
            --set controller.ingressController.env.feature_gates="GatewayAlpha=true"

      - name: Wait for Kong pods to become ready
        run: kubectl wait --for=condition=ready pod -l app.kubernetes.io/instance=kong -n kong --timeout=180s

      - name: Install taskflow chart
        run: |
          helm install taskflow-ci charts/taskflow \
            --namespace taskflow --create-namespace \
            --set secrets.postgresPassword=ci-test-password \
            --set secrets.jwtSecretKey=ci-test-jwt-key \
            --set gateway.className=kong \
            --wait --timeout 180s

      - name: Verify migrate Job succeeded
        # Job удалён самим hook-delete-policy после успеха -- проверяем
        # результат его работы (реальные таблицы в БД), а не сам объект,
        # которого уже нет.
        run: |
          kubectl exec -n taskflow postgres-0 -- \
            psql -U taskflow -d taskflow -c "\dt" | grep -q "tasks" \
            && echo "миграции применены" \
            || (echo "ОШИБКА: таблица tasks не найдена" && exit 1)

      - name: Smoke test backend directly through Service
        run: |
          kubectl port-forward -n taskflow svc/backend 8001:8000 &
          sleep 3
          curl -sf http://localhost:8001/api/v1/health/ready

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "=== helm status ==="
          helm status taskflow-ci -n taskflow || true
          echo "=== pods ==="
          kubectl get pods -n taskflow -o wide
          echo "=== events ==="
          kubectl get events -n taskflow --sort-by='.lastTimestamp'
          echo "=== backend logs ==="
          kubectl logs -n taskflow -l app.kubernetes.io/name=backend --tail=100 || true
