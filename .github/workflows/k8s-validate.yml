name: K8s manifests

on:
  pull_request:
    paths:
      - "infra/k8s/**"
      - "infra/kind/**"
      - ".github/workflows/k8s-validate.yml"
  push:
    branches: [main]
    paths:
      - "infra/k8s/**"

jobs:
  # Уровень 1 — синтаксическая валидность по официальной схеме Kubernetes.
  # Работает без кластера, поэтому быстрый: секунды, а не минуты.
  #
  # Не проверяет объекты Gateway API / Kong (Gateway, HTTPRoute, KongPlugin,
  # GatewayClass) — это CRD сторонних проектов, официальной JSON-схемы
  # Kubernetes для них нет. Их корректность проверяется только вторым уровнем.
  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Validate core Kubernetes manifests against schema
        run: |
          find infra/k8s/base \
            \( -name "00-*.yaml" -o -name "10-*" -o -name "20-*.yaml" \
               -o -name "30-*.yaml" -o -name "40-*.yaml" -o -name "41-*" \
               -o -name "50-*.yaml" -o -name "60-*.yaml" -o -name "61-*.yaml" \) \
            -name "*.yaml*" | \
            xargs kubeconform -strict -summary \
              -kubernetes-version 1.32.0 \
              -ignore-missing-schemas

  # Уровень 2 — применимость манифестов на настоящем, пусть и временном,
  # кластере. Ловит то, что схема не видит: несовпадение selector и
  # template.metadata.labels, ссылки на несуществующие ConfigMap/Secret,
  # и — после введения Gateway API/Kong — реальную готовность Gateway
  # принимать трафик, а не только "манифест применился без ошибки".
  dry-run-in-kind:
    runs-on: ubuntu-latest
    needs: schema-check
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci-taskflow
          wait: 90s

      # Gateway API CRD (GatewayClass, Gateway, HTTPRoute...) — без них
      # kubectl apply на наши манифесты 69-72 падает с
      # "no matches for kind GatewayClass/Gateway/HTTPRoute". Тот же URL,
      # что используется на локальной машине разработчика.
      - name: Install Gateway API CRDs
        run: |
          kubectl apply --server-side -f \
            https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/standard-install.yaml

      # Kong в DB-less режиме — тот же чарт, что и локально. Устанавливает
      # control plane, сам прокси и CRD KongPlugin.
      #
      # NodePort-флаги здесь не имеют значения для самой проверки: в CI
      # трафик снаружи не проверяется (нет аналога extraPortMappings из
      # kind на локальной машине) — доступ к сервисам идёт только через
      # port-forward, см. шаги ниже. Флаги оставлены для единообразия
      # с продовой командой установки.
      - name: Install Kong (Gateway API controller, DB-less)
        # Без --wait: он оборачивает всю установку в один таймаут без
        # объяснения, какой именно под не поднялся. Ожидание готовности
        # вынесено в отдельный шаг ниже — там понятнее видно причину при
        # падении, и таймаут больше (CI-раннер слабее локальной машины
        # разработчика, скачивание образов Kong занимает заметно дольше).
        run: |
          helm repo add kong https://charts.konghq.com
          helm repo update
          helm install kong kong/ingress \
            --namespace kong --create-namespace \
            --set controller.ingressController.env.feature_gates="GatewayAlpha=true"

      - name: Wait for Kong pods to become ready
        run: kubectl wait --for=condition=ready pod -l app.kubernetes.io/instance=kong -n kong --timeout=180s

      - name: Prepare placeholder secrets
        # В CI нет реальных паролей — секреты в .gitignore. Но проверить,
        # что манифесты СТРУКТУРНО согласованы (Deployment ссылается на
        # существующий Secret, а не опечатался в имени), можно и с
        # фиктивными значениями: важен факт применения, а не содержимое.
        run: |
          sed 's/CHANGE-ME-use-a-real-password/ci-placeholder/' \
            infra/k8s/base/10-postgres-secret.yaml.example > infra/k8s/base/10-postgres-secret.yaml
          sed -e 's/CHANGE-ME-password/ci-placeholder/' \
              -e 's/CHANGE-ME-generate-with-secrets-token-urlsafe/ci-placeholder-jwt-secret-for-testing-only/' \
              infra/k8s/base/41-backend-secret.yaml.example > infra/k8s/base/41-backend-secret.yaml

      - name: Apply manifests
        run: kubectl apply -f infra/k8s/base/

      - name: Wait for Postgres to become ready
        run: kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=postgres -n taskflow --timeout=120s

      - name: Wait for migrate Job to complete
        # Job у нас непереиспользуемый (уникальное имя) — это ровно то
        # неудобство, что описано в пункте 6 реестра техдолга (закрыт
        # для Kubernetes) применительно к повторному запуску. В CI это не
        # мешает: кластер эфемерный, конфликта имён быть не может.
        run: kubectl wait --for=condition=complete job/migrate -n taskflow --timeout=120s

      - name: Wait for backend Deployment to become ready
        run: kubectl rollout status deployment/backend -n taskflow --timeout=120s

      # Проверяет именно то, что один раз уже ломалось на практике и заняло
      # больше часа отладки: GatewayClass без аннотации
      # konghq.com/gatewayclass-unmanaged оставляет Gateway в статусе
      # "Waiting for controller" НАВСЕГДА, без единой ошибки при apply.
      # Без этой проверки CI был бы зелёным, даже если Kong вообще не видит
      # наш Gateway — ситуация, в которой мы оказались локально.
      - name: Wait for Gateway to be programmed by Kong
        run: kubectl wait --for=condition=programmed gateway/taskflow -n taskflow --timeout=90s

      - name: Smoke test backend directly through Service
        run: |
          kubectl port-forward -n taskflow svc/backend 8001:8000 &
          sleep 3
          curl -sf http://localhost:8001/api/v1/health/ready

      # Дополнительно к прямому обращению к backend — тот же запрос, но
      # ЧЕРЕЗ Kong и HTTPRoute, как это происходит для реального внешнего
      # трафика. Проверяет всю цепочку маршрутизации, а не только то, что
      # backend сам по себе жив.
      - name: Smoke test through Kong Gateway (HTTPRoute routing)
        run: |
          kubectl port-forward -n kong svc/kong-gateway-proxy 8080:80 &
          sleep 3
          curl -sf http://localhost:8080/api/v1/health/ready

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "=== pods (taskflow) ==="
          kubectl get pods -n taskflow -o wide
          echo "=== events (taskflow) ==="
          kubectl get events -n taskflow --sort-by='.lastTimestamp'
          echo "=== backend logs ==="
          kubectl logs -n taskflow -l app.kubernetes.io/name=backend --tail=100 || true
          echo "=== gateway status ==="
          kubectl describe gateway taskflow -n taskflow || true
          echo "=== gatewayclass status ==="
          kubectl describe gatewayclass kong || true
          echo "=== pods (kong) ==="
          kubectl get pods -n kong -o wide || true
          echo "=== kong controller logs ==="
          kubectl logs -n kong deployment/kong-controller --tail=100 || true
