name: CD

on:
  push:
    branches: [main]

# По умолчанию GITHUB_TOKEN может не иметь прав на публикацию пакетов —
# явно запрашиваем нужный scope здесь, а не полагаемся на настройки
# организации по умолчанию.
permissions:
  contents: read
  packages: write

jobs:
  publish-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU нужен, чтобы amd64-раннер GitHub мог собирать arm64-образ через
      # эмуляцию. buildx — расширенный сборщик, умеющий multi-platform manifest.
      # Итог: один тег :latest содержит варианты под обе архитектуры, и docker
      # pull сам выбирает нужный — образ заработает и на Apple Silicon (arm64),
      # и на старом ноутбуке с Intel (amd64), без предупреждений о платформе.
      #
      # Trade-off: arm64-часть собирается под эмуляцией и потому медленно
      # (минуты вместо секунд). Быстрее было бы собирать каждую архитектуру на
      # нативном раннере (ubuntu-24.04-arm) и сшивать манифест отдельным шагом,
      # но это усложняет workflow — для частоты коммитов pet-проекта не нужно.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/taskflow-backend:latest
            ghcr.io/${{ github.repository_owner }}/taskflow-backend:${{ steps.vars.outputs.sha_short }}

  publish-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: true
          platforms: linux/amd64,linux/arm64
          # PROD_API_URL — repository variable (Settings → Secrets and
          # variables → Actions → Variables), не secret: это не чувствительные
          # данные, а просто адрес backend, который увидит браузер пользователя.
          build-args: |
            VITE_API_URL=${{ vars.PROD_API_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/taskflow-frontend:latest
            ghcr.io/${{ github.repository_owner }}/taskflow-frontend:${{ steps.vars.outputs.sha_short }}
