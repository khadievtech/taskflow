name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    # Service containers — сайдкары для этого job'а. Аналог docker-compose,
    # но с ключевым отличием: подключение идёт через localhost, а не по
    # имени сервиса — раннер пробрасывает порт наружу сам.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://taskflow:taskflow@localhost:5432/taskflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install --no-cache-dir -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Type check (mypy)
        run: mypy app

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type check + build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    # Не тратим минуты раннера на сборку образов, если тесты уже упали —
    # сначала должны пройти оба job'а выше.
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend production image
        run: docker build --target production -t taskflow-backend:ci ./backend

      - name: Build frontend production image
        run: docker build --target production -t taskflow-frontend:ci ./frontend
