global:
  # Как часто опрашивать цели. 15s — общепринятый компромисс: достаточно часто,
  # чтобы заметить проблему, достаточно редко, чтобы не раздувать объём данных.
  scrape_interval: 15s
  # Как часто пересчитывать правила алертов (появятся в Phase 4c).
  evaluation_interval: 15s
  external_labels:
    environment: home-prod

# Файлы с правилами алертов. Prometheus пересчитывает их каждые
# evaluation_interval и, когда условие держится дольше `for`, отправляет
# алерт в Alertmanager.
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus всегда мониторит сам себя — если он деградирует, вы должны
  # увидеть это в тех же графиках, а не узнать от пользователей.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Метрики приложения. Обращаемся по имени сервиса backend — оно резолвится
  # через DNS общей docker-сети, так же как backend обращается к db.
  - job_name: taskflow-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  # Сам Alertmanager тоже под наблюдением: если он молча перестанет
  # доставлять уведомления, вы не узнаете об инцидентах вообще. Метрика
  # alertmanager_notifications_failed_total показывает сбои доставки.
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # Метрики Postgres. Сама БД не умеет отдавать данные в формате Prometheus —
  # для этого существует паттерн "экспортёр": отдельный процесс подключается
  # к сервису своим родным протоколом и переводит внутреннюю статистику
  # в метрики. Так же устроены экспортёры для Redis, Kafka, Nginx и прочего.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
