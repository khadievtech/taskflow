apiVersion: 1

providers:
  - name: taskflow
    orgId: 1
    folder: TaskFlow
    type: file
    disableDeletion: false
    # Grafana перечитывает файлы дашбордов с этим интервалом — можно править
    # JSON на диске и видеть изменения без перезапуска контейнера.
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
