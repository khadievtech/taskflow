# Provisioning: Grafana читает этот файл при старте и сама создаёт источник
# данных. Альтернатива — добавлять его руками через UI, но тогда конфигурация
# живёт только внутри контейнера и теряется при пересоздании. Описанный файлом
# источник воспроизводится автоматически на любой машине — это тот же принцип
# infrastructure as code, что и в Terraform.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Явный uid: дашборды ссылаются на источник по uid, а не по имени.
    # Без него Grafana сгенерирует случайный, и провижининг дашборда сломается.
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    # Позволяет заменить настройки при перезапуске, если файл изменился.
    editable: false

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # Связывает логи с трейсами: если в строке лога встречается request_id,
      # Grafana превратит его в кликабельную ссылку. Пока ведёт на поиск по
      # тому же Loki, а после внедрения OpenTelemetry (за рамками этого этапа)
      # сюда подставляется источник трейсов.
      derivedFields:
        - name: request_id
          matcherRegex: '"request_id":\s*"([^"]+)"'
          datasourceUid: loki
          url: '$${__value.raw}'
