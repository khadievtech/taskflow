# Loki в режиме single binary — все компоненты (distributor, ingester, querier,
# compactor) в одном процессе. Для домашнего сервера это правильный выбор:
# микросервисный режим Loki требует объектного хранилища и оправдан на объёмах,
# где один процесс перестаёт справляться.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # warn, а не info: Alloy собирает логи всех контейнеров, включая сам Loki.
  # На уровне info Loki логировал бы каждый принятый батч, Alloy отправлял бы
  # эти строки обратно в Loki, и получилась бы положительная обратная связь.
  log_level: warn

common:
  path_prefix: /loki
  # replication_factor: 1 и ring в памяти — единственный корректный вариант
  # для одного экземпляра. Значение больше 1 требует нескольких инстансов
  # и внешнего хранилища для ring (Consul, etcd, memberlist).
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    # Записи в schema_config неизменяемы: Loki по дате from определяет, каким
    # форматом читать старые данные. Менять существующую запись нельзя —
    # при переходе на новую схему добавляют новую запись с будущей датой.
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 7 дней хранения. Логи занимают существенно больше места, чем метрики,
  # поэтому срок короче, чем 15 дней у Prometheus.
  retention_period: 168h
  # Отклонять записи старше окна. Типичная ситуация при первом запуске:
  # Alloy находит контейнер, работающий давно, и пытается отправить всю его
  # историю — старые строки будут отброшены с ошибкой в логах Alloy.
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  # Без retention_enabled: true параметр retention_period выше не работает —
  # именно compactor физически удаляет устаревшие чанки и записи индекса.
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem
