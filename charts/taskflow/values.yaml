# values.yaml -- единственный файл, который меняет пользователь чарта.
# Всё остальное в templates/ читает значения ОТСЮДА через ссылки на .Values,
# а не содержит зашитых чисел -- в этом весь смысл параметризации.
#
# Структура сознательно единообразна для backend/frontend (оба stateless,
# оба Deployment) -- одинаковый набор ключей упрощает чтение и позволяет
# в будущем вынести общий шаблон в partial (_helpers.tpl), если понадобится.

namespace: taskflow-helm-test

postgres:
  image:
    repository: postgres
    tag: "16-alpine"
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  # database/user НЕ секретны сами по себе, поэтому здесь, в values.yaml,
  # а не в Secret -- секретен только пароль (см. секцию secrets ниже).
  database: taskflow
  user: taskflow

backend:
  image:
    repository: ghcr.io/khadievtech/taskflow-backend
    tag: latest
  replicaCount: 2
  # Обёртка OpenTelemetry включается флагом, а не жёстко зашита в команду --
  # позволяет временно откатить её одной строкой values, не трогая шаблон.
  # Именно с этой проблемой мы столкнулись при первом включении трейсинга
  # (проблема курицы и яйца между CD и манифестами).
  tracing:
    enabled: true
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  config:
    environment: production
    debug: false
    cookieSecure: false
    allowRegistration: false
    corsOrigins: "[]"

frontend:
  image:
    repository: ghcr.io/khadievtech/taskflow-frontend
    tag: latest
  replicaCount: 2
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits:   { cpu: 200m, memory: 128Mi }

gateway:
  # Имя GatewayClass, созданного установкой Kong -- НЕ создаётся этим
  # чартом, чарт лишь ссылается на уже существующий, как и раньше.
  className: kong
  rateLimit:
    authEndpoints:
      minute: 20

# Секреты НЕ хранятся здесь -- values.yaml отслеживается git (или, как
# минимум, обычно коммитится вместе с чартом). Пароль БД и ключ JWT задаются
# отдельным файлом values-secrets.yaml (в .gitignore), применяемым вторым
# -f поверх этого -- тот же паттерн разделения "публичный/секретный", что
# уже использовался для Grafana и Alertmanager.
secrets:
  postgresPassword: ""
  jwtSecretKey: ""
