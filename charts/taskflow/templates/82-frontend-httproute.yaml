# Маршрут по умолчанию -- Gateway API сам сортирует правила по
# специфичности пути независимо от того, в каком объекте они объявлены:
# /api/ и /api/v1/auth/ (более длинные префиксы) перехватят свои запросы
# раньше, этот подхватит только то, что не подошло ни под один из них.

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: taskflow
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
