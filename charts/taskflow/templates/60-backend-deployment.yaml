apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"

          # Обёртка opentelemetry-instrument включается флагом
          # backend.tracing.enabled, а не зашита жёстко -- позволяет
          # откатить трейсинг одной строкой values.yaml без правки шаблона,
          # если в образе временно не окажется нужных пакетов (та самая
          # проблема курицы и яйца между CD и манифестами).
          {{- if .Values.backend.tracing.enabled }}
          command:
            [
              "opentelemetry-instrument",
              "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
            ]
          {{- else }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          {{- end }}

          envFrom:
            - configMapRef:
                name: backend
            - secretRef:
                name: backend
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 3
            failureThreshold: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
