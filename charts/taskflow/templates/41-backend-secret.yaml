# DATABASE_URL собирается ЗДЕСЬ, в шаблоне, из отдельных значений values --
# не хранится собранной строкой в values-secrets.yaml. Хост "postgres" --
# короткое DNS-имя headless Service, работает только потому, что backend
# и postgres в одном namespace.
apiVersion: v1
kind: Secret
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://{{ .Values.postgres.user }}:{{ .Values.secrets.postgresPassword }}@postgres:5432/{{ .Values.postgres.database }}"
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | quote }}
