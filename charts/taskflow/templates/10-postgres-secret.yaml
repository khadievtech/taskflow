# Пароль сюда попадает НЕ из основного values.yaml (там пустая строка по
# умолчанию), а из отдельного values-secrets.yaml, применяемого вторым -f
# при установке. Тот же паттерн разделения "публичный/секретный", что уже
# использовался для пароля Grafana и токена Telegram-бота -- секретный
# файл в .gitignore, сюда попадает только через ссылку на .Values ниже.

apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
