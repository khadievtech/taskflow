apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: auth-rate-limit
  namespace: {{ .Values.namespace }}
config:
  minute: {{ .Values.gateway.rateLimit.authEndpoints.minute }}
  policy: local
  limit_by: ip
plugin: rate-limiting

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-auth
  namespace: {{ .Values.namespace }}
  annotations:
    konghq.com/plugins: auth-rate-limit
spec:
  parentRefs:
    - name: taskflow
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/auth/
      backendRefs:
        - name: backend
          port: 8000
