# Chart.yaml -- паспорт самого чарта, не приложения внутри него.
#
# apiVersion: v2 -- современный формат чарта (Helm 3), поддерживает
# зависимости между чартами и хуки жизненного цикла, которых не было в v1.

apiVersion: v2
name: taskflow
description: >-
  Kanban-трекер задач TaskFlow -- backend (FastAPI), frontend (React+nginx),
  Postgres, маршрутизация через Kong (Gateway API). Собственный чарт,
  в отличие от kube-prometheus-stack/Kong/Loki/Tempo -- те устанавливаются
  готовыми чартами из внешних репозиториев, этот описывает НАШЕ приложение.

type: application

# Версия самого ЧАРТА (структуры шаблонов) -- растёт при изменении
# манифестов, НЕ при выходе новой версии приложения. Отдельно от appVersion.
version: 0.1.0

# Версия ПРИЛОЖЕНИЯ внутри -- то, что реально задеплоено. Обычно совпадает
# с тегом Docker-образа, но образы у нас тегируются SHA коммита плюс
# :latest, поэтому здесь скорее ориентир для человека, чем точное значение,
# от которого зависит логика чарта.
appVersion: "0.6.0"

keywords:
  - taskflow
  - kanban
  - fastapi
  - react

maintainers:
  - name: khadievtech
